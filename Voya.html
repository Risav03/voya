<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voya — Reels to Real Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;
      background:linear-gradient(135deg,#FFF0E6 0%,#E8F8FF 50%,#F0FFF4 100%);}
    #root{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
    ::-webkit-scrollbar{display:none;}

    @keyframes float      {0%,100%{transform:translateY(0)}  50%{transform:translateY(-10px)}}
    @keyframes float2     {0%,100%{transform:translateY(0)}  50%{transform:translateY(-6px)}}
    @keyframes float3     {0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8px) rotate(3deg)}}
    @keyframes spin-sun   {from{transform:rotate(0)} to{transform:rotate(360deg)}}
    @keyframes slide-up   {from{transform:translateY(22px);opacity:0} to{transform:translateY(0);opacity:1}}
    @keyframes fade-in    {from{opacity:0} to{opacity:1}}
    @keyframes bounce-in  {0%{transform:scale(.7);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1}}
    @keyframes bounce-dot {0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-8px);opacity:1}}
    @keyframes wiggle     {0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)}}
    @keyframes pop        {0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)}}
    @keyframes cloud-drift{0%{transform:translateX(0)} 100%{transform:translateX(12px)}}
    @keyframes shimmer    {0%{background-position:-300% 0} 100%{background-position:300% 0}}
    @keyframes arc-draw   {from{stroke-dashoffset:400} to{stroke-dashoffset:0}}
    @keyframes pulse-ring {0%{transform:scale(1);opacity:.6} 100%{transform:scale(2.2);opacity:0}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ─── TOKENS ─── */
const T = {
  coral:   '#FF6B6B',
  teal:    '#4ECDC4',
  sun:     '#FFD93D',
  mint:    '#6BCB77',
  sky:     '#74C0FC',
  lavender:'#C77DFF',
  bg:      '#FFFBF7',
  surface: '#FFFFFF',
  text:    '#1A1A2E',
  muted:   '#9BA5B7',
  border:  '#F0EDE8',
};

/* ─── ILLUSTRATIONS ─── */

/* Cute globe */
function FunGlobe({ size = 210 }) {
  const cx = size/2, cy = size/2, r = size/2 - 14;
  const dots = [
    {x:cx-24,y:cy-20},{x:cx+44,y:cy-14},{x:cx+18,y:cy+30},
    {x:cx-50,y:cy+14},{x:cx+6,y:cy-40},{x:cx+60,y:cy-24},
  ];
  const dotColors = [T.coral, T.sun, T.mint, T.teal, T.lavender, T.coral];
  const lats = [-50,-25,0,25,50];
  const lons = [-60,-30,0,30,60];
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <defs>
        <clipPath id="gc2"><circle cx={cx} cy={cy} r={r}/></clipPath>
        <radialGradient id="gbg2" cx="38%" cy="30%" r="70%">
          <stop offset="0%"   stopColor="#BAE8FF"/>
          <stop offset="60%"  stopColor="#74C0FC"/>
          <stop offset="100%" stopColor="#4ECDC4"/>
        </radialGradient>
        <radialGradient id="gsun2" cx="35%" cy="25%" r="50%">
          <stop offset="0%" stopColor="white" stopOpacity=".35"/>
          <stop offset="100%" stopColor="white" stopOpacity="0"/>
        </radialGradient>
        <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#4ECDC4" floodOpacity=".35"/>
        </filter>
      </defs>

      {/* drop shadow */}
      <circle cx={cx} cy={cy} r={r} filter="url(#shadow2)" fill="transparent"/>

      {/* base */}
      <circle cx={cx} cy={cy} r={r} fill="url(#gbg2)"/>

      {/* land masses — playful blobs */}
      <g clipPath="url(#gc2)">
        <ellipse cx={cx-18} cy={cy-10} rx={28} ry={22} fill="#6BCB77" opacity=".85"/>
        <ellipse cx={cx+36} cy={cy-18} rx={20} ry={28} fill="#6BCB77" opacity=".8"/>
        <ellipse cx={cx+10} cy={cy+28} rx={36} ry={18} fill="#6BCB77" opacity=".85"/>
        <ellipse cx={cx-44} cy={cy+22} rx={18} ry={14} fill="#6BCB77" opacity=".75"/>
        {/* grid lines */}
        {lats.map((lat,i)=>{
          const ey = cy + r*Math.sin(lat*Math.PI/180);
          const ex = r*Math.cos(lat*Math.PI/180);
          return <ellipse key={i} cx={cx} cy={ey} rx={ex} ry={ex*.28} stroke="white" strokeWidth=".7" fill="none" opacity=".25"/>;
        })}
        {lons.map((lon,i)=>{
          const px = cx + r*Math.sin(lon*Math.PI/180);
          const ex = r*Math.abs(Math.cos(lon*Math.PI/180))*.28;
          return <ellipse key={i} cx={px} cy={cy} rx={ex} ry={r} stroke="white" strokeWidth=".7" fill="none" opacity=".25"/>;
        })}
      </g>

      {/* route arcs */}
      <g clipPath="url(#gc2)" fill="none">
        <path d={`M${cx-24} ${cy-20} Q${cx+10} ${cy-60} ${cx+44} ${cy-14}`}
          stroke="white" strokeWidth="2" strokeLinecap="round" strokeDasharray="400"
          style={{animation:'arc-draw 2s ease .3s both'}}/>
        <path d={`M${cx+44} ${cy-14} Q${cx+58} ${cy+8} ${cx+18} ${cy+30}`}
          stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeDasharray="400" opacity=".7"
          style={{animation:'arc-draw 2s ease .9s both'}}/>
      </g>

      {/* destination pins */}
      <g clipPath="url(#gc2)">
        {dots.map((d,i)=>(
          <g key={i} style={{animation:`float ${2.5+i*.3}s ease ${i*.2}s infinite`}}>
            <circle cx={d.x} cy={d.y} r={8}  fill={dotColors[i]} opacity=".25"/>
            <circle cx={d.x} cy={d.y} r={4}  fill={dotColors[i]}/>
            <circle cx={d.x} cy={d.y-1} r={1.5} fill="white" opacity=".9"/>
          </g>
        ))}
      </g>

      {/* highlight */}
      <circle cx={cx} cy={cy} r={r} fill="url(#gsun2)"/>
    </svg>
  );
}

/* Paper plane illustration */
function PaperPlane({ size = 80, color = T.coral }) {
  return (
    <svg width={size} height={size*.7} viewBox="0 0 80 56" fill="none">
      <path d="M2 28L78 4L54 52L40 34L2 28z" fill={color} opacity=".9"/>
      <path d="M40 34L78 4L54 52z" fill={color} opacity=".4"/>
      <path d="M2 28L40 34L34 46z" fill="white" opacity=".3"/>
      {/* trail dots */}
      {[0,1,2,3].map(i=>(
        <circle key={i} cx={8+i*10} cy={38+i*4} r={2.5-i*.4}
          fill={color} opacity={.5-i*.1}/>
      ))}
    </svg>
  );
}

/* Hot air balloon */
function Balloon({ size = 70 }) {
  return (
    <svg width={size} height={size*1.3} viewBox="0 0 70 90" fill="none">
      <ellipse cx="35" cy="35" rx="30" ry="32" fill={T.coral}/>
      <path d="M5 35 Q35 10 65 35" fill={T.sun} opacity=".9"/>
      <path d="M5 35 Q35 60 65 35" fill={T.teal} opacity=".8"/>
      <ellipse cx="35" cy="35" rx="30" ry="32" fill="none" stroke="white" strokeWidth="1.5" opacity=".3"/>
      {/* vertical lines */}
      {[-15,0,15].map(x=>(
        <line key={x} x1={35+x} y1={5} x2={35+x} y2={65} stroke="white" strokeWidth="1" opacity=".2"/>
      ))}
      {/* basket ropes */}
      <line x1="28" y1="67" x2="26" y2="82" stroke="#C9956A" strokeWidth="1.5"/>
      <line x1="42" y1="67" x2="44" y2="82" strokeWidth="1.5" stroke="#C9956A"/>
      <rect x="22" y="82" width="26" height="8" rx="3" fill="#C9956A"/>
    </svg>
  );
}

/* Palm tree */
function Palm({ size = 60, flip = false }) {
  return (
    <svg width={size} height={size*1.5} viewBox="0 0 60 90" fill="none"
      style={{transform: flip ? 'scaleX(-1)' : 'none'}}>
      {/* trunk */}
      <path d="M28 90 Q32 70 30 50 Q28 35 32 20" stroke="#C9956A" strokeWidth="6" strokeLinecap="round"/>
      {/* fronds */}
      <path d="M32 22 Q10 10 2 20" stroke={T.mint} strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M32 22 Q50 5 58 12" stroke={T.mint} strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M32 22 Q20 2 28 -2" stroke={T.mint} strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M32 22 Q46 15 52 24" stroke="#4CB86A" strokeWidth="3" strokeLinecap="round"/>
      <path d="M32 22 Q18 18 12 28" stroke="#4CB86A" strokeWidth="3" strokeLinecap="round"/>
      {/* coconuts */}
      <circle cx="30" cy="28" r="4" fill="#C9956A"/>
      <circle cx="35" cy="25" r="3.5" fill="#C9956A"/>
    </svg>
  );
}

/* Cloud */
function Cloud({ width = 90, opacity = 1, color = 'white' }) {
  return (
    <svg width={width} height={width*.55} viewBox="0 0 90 50" fill="none">
      <ellipse cx="45" cy="35" rx="38" ry="20" fill={color} opacity={opacity}/>
      <ellipse cx="30" cy="30" rx="22" ry="18" fill={color} opacity={opacity}/>
      <ellipse cx="62" cy="32" rx="20" ry="16" fill={color} opacity={opacity}/>
    </svg>
  );
}

/* ─── BOTTOM NAV ─── */
function BottomNav({ active, onTab }) {
  const tabs = [
    { id:'home',        label:'Home',   emoji:'🏠' },
    { id:'collections', label:'Saved',  emoji:'📌' },
    { id:'reel',        label:'',       special:true },
    { id:'trips',       label:'Trips',  emoji:'✈️' },
    { id:'globe',       label:'Globe',  emoji:'🌍' },
  ];
  return (
    <div style={{
      position:'absolute', bottom:0, left:0, right:0, height:78,
      background:'white', borderTop:`2px solid ${T.border}`,
      display:'flex', alignItems:'flex-start', justifyContent:'space-around',
      paddingTop:8, paddingBottom:8, zIndex:50,
      borderRadius:'0 0 48px 48px',
    }}>
      {tabs.map(tab => {
        const isActive = active === tab.id;
        if (tab.special) return (
          <button key="reel" onClick={() => onTab('reel')} style={{
            display:'flex', flexDirection:'column', alignItems:'center',
            background:'none', border:'none', cursor:'pointer', padding:'0 6px',
          }}>
            <div style={{
              width:50, height:50, borderRadius:'50%', marginTop:-22,
              background:`linear-gradient(135deg, ${T.coral}, #FF8E53)`,
              display:'flex', alignItems:'center', justifyContent:'center',
              boxShadow:`0 6px 20px ${T.coral}55`,
              fontSize:22,
              animation: isActive ? 'pop 0.4s ease' : 'none',
            }}>➕</div>
          </button>
        );
        return (
          <button key={tab.id} onClick={() => onTab(tab.id)} style={{
            display:'flex', flexDirection:'column', alignItems:'center', gap:2,
            background:'none', border:'none', cursor:'pointer',
            padding:'4px 10px', minWidth:52,
          }}>
            <div style={{
              width:36, height:36, borderRadius:12,
              background: isActive ? `${T.coral}18` : 'transparent',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:18, transition:'all .2s',
            }}>{tab.emoji}</div>
            <span style={{
              fontSize:10, fontFamily:'Nunito', fontWeight: isActive ? 800 : 600,
              color: isActive ? T.coral : T.muted,
            }}>{tab.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ─── SCREEN: ONBOARDING ─── */
function OnboardingScreen({ onEnter }) {
  return (
    <div style={{
      height:'100%', display:'flex', flexDirection:'column', alignItems:'center',
      justifyContent:'center', padding:'0 28px', position:'relative', overflow:'hidden',
      background:'linear-gradient(180deg, #E8F8FF 0%, #FFF8F0 60%, #F0FFF4 100%)',
    }}>
      {/* floating clouds */}
      <div style={{position:'absolute', top:80, left:-10, animation:'cloud-drift 4s ease-in-out infinite alternate'}}>
        <Cloud width={100} opacity={.7} color="white"/>
      </div>
      <div style={{position:'absolute', top:120, right:-20, animation:'cloud-drift 5s ease-in-out infinite alternate-reverse'}}>
        <Cloud width={80} opacity={.5} color="white"/>
      </div>

      {/* sun rays */}
      <div style={{
        position:'absolute', top:-60, right:-60,
        width:220, height:220, borderRadius:'50%',
        background:'radial-gradient(circle, #FFD93D55 0%, transparent 70%)',
        animation:'spin-sun 20s linear infinite',
      }}/>

      {/* floating balloon */}
      <div style={{
        position:'absolute', top:90, right:24,
        animation:'float3 4s ease-in-out infinite',
        opacity:.85,
      }}>
        <Balloon size={52}/>
      </div>

      {/* palm trees */}
      <div style={{position:'absolute', bottom:0, left:0, opacity:.7}}>
        <Palm size={50}/>
      </div>
      <div style={{position:'absolute', bottom:0, right:0, opacity:.7}}>
        <Palm size={44} flip={true}/>
      </div>

      {/* Globe */}
      <div style={{animation:'float 4.5s ease-in-out infinite', marginBottom:16, zIndex:1}}>
        <FunGlobe size={200}/>
      </div>

      {/* Wordmark */}
      <div style={{
        fontFamily:'Fredoka One, cursive', fontSize:56, color:T.coral,
        animation:'bounce-in .7s ease .2s both', marginBottom:6,
        letterSpacing:2,
      }}>voya ✈️</div>

      <div style={{
        fontFamily:'Nunito', fontWeight:700, fontSize:13, color:T.teal,
        letterSpacing:2, textTransform:'uppercase',
        animation:'slide-up .6s ease .4s both', marginBottom:20,
      }}>Reels → Real Adventures</div>

      <p style={{
        textAlign:'center', fontSize:15, lineHeight:1.7,
        color:'#555', fontFamily:'Nunito', fontWeight:500,
        animation:'slide-up .6s ease .55s both', marginBottom:32, maxWidth:260,
      }}>
        Save travel reels. Discover real places. Plan your dream trips with AI! 🌴
      </p>

      {/* CTA */}
      <button onClick={onEnter} style={{
        background:`linear-gradient(135deg, ${T.coral}, #FF8E53)`,
        border:'none', borderRadius:99, cursor:'pointer',
        padding:'16px 48px',
        fontFamily:'Nunito', fontWeight:800, fontSize:17, color:'white',
        boxShadow:`0 8px 28px ${T.coral}45`,
        animation:'slide-up .6s ease .7s both',
        letterSpacing:.3,
      }}>Let's go! 🚀</button>

      <button style={{
        background:'none', border:'none', cursor:'pointer',
        color:T.muted, fontFamily:'Nunito', fontWeight:600,
        fontSize:13, marginTop:16,
        animation:'slide-up .6s ease .85s both',
      }}>Already have an account? Sign in</button>
    </div>
  );
}

/* ─── PLACE CARD ─── */
const placeGrads = [
  ['#FFD93D','#FF9F45'], // sunny yellow-orange
  ['#74C0FC','#4ECDC4'], // sky-teal
  ['#C77DFF','#FF6B6B'], // lavender-coral
  ['#6BCB77','#4ECDC4'], // mint-teal
];

function PlaceCard({ name, country, grad, style: extraStyle }) {
  return (
    <div style={{
      flexShrink:0, width:130, height:165, borderRadius:22, overflow:'hidden',
      background:`linear-gradient(160deg, ${grad[0]}, ${grad[1]})`,
      position:'relative', cursor:'pointer',
      boxShadow:`0 8px 24px ${grad[1]}44`,
      ...extraStyle,
    }}>
      {/* wavy bottom */}
      <svg style={{position:'absolute',bottom:0,left:0,width:'100%'}} viewBox="0 0 130 50" preserveAspectRatio="none">
        <path d="M0 50 Q30 32 65 40 Q100 48 130 30 L130 50Z" fill="rgba(255,255,255,.25)"/>
      </svg>
      {/* sun decoration */}
      <div style={{
        position:'absolute', top:-20, right:-20, width:80, height:80, borderRadius:'50%',
        background:'rgba(255,255,255,.15)',
      }}/>
      {/* pin emoji */}
      <div style={{position:'absolute', top:12, left:12, fontSize:18}}>📍</div>
      {/* label */}
      <div style={{position:'absolute', bottom:12, left:12}}>
        <div style={{fontSize:13, fontWeight:800, color:'white', fontFamily:'Nunito'}}>{name}</div>
        <div style={{fontSize:10, color:'rgba(255,255,255,.8)', marginTop:1, fontFamily:'Nunito', fontWeight:600}}>{country}</div>
      </div>
    </div>
  );
}

/* ─── SCREEN: HOME ─── */
function HomeScreen({ onSaveReel }) {
  const places = [
    {name:'Kyoto',     country:'Japan',       grad:placeGrads[0]},
    {name:'Santorini', country:'Greece',      grad:placeGrads[1]},
    {name:'Bali',      country:'Indonesia',   grad:placeGrads[2]},
    {name:'Marrakech', country:'Morocco',     grad:placeGrads[3]},
  ];
  return (
    <div style={{height:'100%', overflowY:'auto', background:'#FFFBF7', paddingBottom:90}}>
      {/* Header bar */}
      <div style={{
        padding:'72px 22px 20px',
        background:'linear-gradient(180deg, #E8F8FF, #FFFBF7)',
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20}}>
          <div>
            <div style={{fontSize:13, color:T.muted, fontFamily:'Nunito', fontWeight:700, marginBottom:2}}>
              Good morning ☀️
            </div>
            <div style={{fontFamily:'Fredoka One', fontSize:28, color:T.text}}>Risav!</div>
          </div>
          <div style={{
            width:44, height:44, borderRadius:'50%',
            background:`linear-gradient(135deg, ${T.coral}, ${T.sun})`,
            display:'flex', alignItems:'center', justifyContent:'center',
            fontFamily:'Fredoka One', fontSize:18, color:'white',
            boxShadow:`0 4px 14px ${T.coral}44`,
          }}>R</div>
        </div>

        {/* stats pills */}
        <div style={{display:'flex', gap:10}}>
          {[
            {n:'24', l:'Places', emoji:'📍', color:T.coral},
            {n:'8',  l:'Reels',  emoji:'🎬', color:T.teal},
            {n:'3',  l:'Trips',  emoji:'✈️', color:T.lavender},
          ].map(s => (
            <div key={s.l} style={{
              flex:1, background:'white', borderRadius:18, padding:'14px 10px', textAlign:'center',
              boxShadow:'0 2px 12px rgba(0,0,0,.06)', border:`1.5px solid ${s.color}22`,
            }}>
              <div style={{fontSize:20, marginBottom:2}}>{s.emoji}</div>
              <div style={{fontFamily:'Fredoka One', fontSize:24, color:s.color}}>{s.n}</div>
              <div style={{fontSize:10, color:T.muted, fontFamily:'Nunito', fontWeight:700}}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Save a Reel CTA */}
      <div style={{padding:'0 22px', marginBottom:24}}>
        <button onClick={onSaveReel} style={{
          width:'100%', borderRadius:22, border:'none', cursor:'pointer',
          background:`linear-gradient(135deg, ${T.coral}, #FF8E53)`,
          padding:'18px 20px',
          display:'flex', alignItems:'center', gap:14,
          boxShadow:`0 8px 24px ${T.coral}40`,
          position:'relative', overflow:'hidden',
        }}>
          <div style={{
            position:'absolute', inset:0,
            background:'linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent)',
            backgroundSize:'300% 100%', animation:'shimmer 2.5s linear infinite',
          }}/>
          <div style={{
            width:48, height:48, borderRadius:15, background:'rgba(255,255,255,.25)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:24, flexShrink:0,
          }}>🎬</div>
          <div style={{flex:1, textAlign:'left'}}>
            <div style={{fontSize:16, fontWeight:800, color:'white', fontFamily:'Nunito', marginBottom:2}}>
              Save a travel reel!
            </div>
            <div style={{fontSize:12, color:'rgba(255,255,255,.8)', fontFamily:'Nunito', fontWeight:600}}>
              Instagram · TikTok · YouTube
            </div>
          </div>
          <div style={{fontSize:22}}>→</div>
        </button>
      </div>

      {/* Saved places */}
      <div style={{marginBottom:24}}>
        <div style={{
          padding:'0 22px', marginBottom:14,
          display:'flex', alignItems:'center', justifyContent:'space-between',
        }}>
          <div style={{fontFamily:'Fredoka One', fontSize:20, color:T.text}}>Saved Places 📍</div>
          <div style={{fontFamily:'Nunito', fontWeight:700, fontSize:13, color:T.coral, cursor:'pointer'}}>See all</div>
        </div>
        <div style={{display:'flex', gap:12, overflowX:'auto', paddingLeft:22, paddingRight:22}}>
          {places.map((p,i) => (
            <PlaceCard key={p.name} {...p}
              style={{animation:`slide-up .35s ease ${i*.07}s both`}}/>
          ))}
        </div>
      </div>

      {/* AI suggestion card */}
      <div style={{padding:'0 22px'}}>
        <div style={{fontFamily:'Fredoka One', fontSize:20, color:T.text, marginBottom:14}}>AI Picks for you ✨</div>
        <div style={{
          background:'white', borderRadius:22,
          border:`2px solid ${T.teal}33`,
          padding:'18px', display:'flex', alignItems:'center', gap:14,
          boxShadow:'0 4px 20px rgba(78,205,196,.15)',
        }}>
          <div style={{fontSize:36}}>🌸</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15, fontWeight:800, color:T.text, fontFamily:'Nunito', marginBottom:3}}>

      {/* handle shines */}

              <div style={{animation:`float ${3+i*.3}s ease-in-out ${i*.2}s infinite`}}>
                <Trophy3D emoji={trip.emoji} color1={trip.c1} color2={trip.c2} size={110}/>
              </div>
              <div style={{
                fontFamily:'Fredoka One', fontSize:14, color:T.text,
                textAlign:'center', marginTop:6, lineHeight:1.3,
              }}>{trip.title}</div>
              <div style={{
                fontFamily:'Nunito', fontWeight:700, fontSize:11, color:T.muted, marginTop:3,
              }}>📅 {trip.year} · {trip.days}d</div>
              {/* badge */}
              <div style={{
                marginTop:8, background:`${trip.c1}1A`,
                borderRadius:99, padding:'4px 10px',
                fontFamily:'Nunito', fontWeight:800, fontSize:10, color:trip.c1,
              }}>Completed ✓</div>
            </div>
          ))}
        </div>
      </div>

      {/* bottom ghost padding */}
      <div style={{height:16}}/>
    </div>
  );
}

/* ─── MAIN APP ─── */
function VoyaApp() {
  const [screen, setScreen] = useState('onboarding');
  const [tab, setTab] = useState('home');

  const handleTab = (id) => {
    if (id === 'reel') { setScreen('reel'); return; }
    setTab(id); setScreen('main');
  };

  const renderTab = () => ({
    home:        <HomeScreen onSaveReel={() => setScreen('reel')}/>,
    collections: <CollectionsScreen/>,
    trips:       <TripsScreen/>,
    globe:       <GlobeScreen/>,
  }[tab] || <HomeScreen onSaveReel={() => setScreen('reel')}/>);

  if (screen === 'onboarding') return (
    <div style={{height:'100%'}}>
      <OnboardingScreen onEnter={() => setScreen('main')}/>
    </div>
  );

  return (
    <div style={{height:'100%', position:'relative'}} key={screen+tab}>
      <div style={{height:'100%', animation:'fade-in .22s ease'}}>
        {screen === 'reel' ? <ReelSaveScreen onBack={() => setScreen('main')}/> : renderTab()}
      </div>
      <BottomNav active={screen==='reel'?'reel':tab} onTab={handleTab}/>
    </div>
  );
}
